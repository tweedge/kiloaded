name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (mutable tags can be repointed).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Shell syntax
        run: |
          dash -n kiloaded install.sh tests/run.sh tests/smoke.sh tests/fakes/*
          bash -n kiloaded install.sh tests/run.sh tests/smoke.sh tests/fakes/*

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -s sh kiloaded install.sh tests/run.sh tests/smoke.sh tests/fakes/*

      - name: Hermetic tests
        run: ./tests/run.sh

  smoke:
    # Real npm, real Kilo binary, real health check. Not on pull requests
    # because it needs network and downloads a few hundred MB.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Real install/serve/update/remove
        run: KILOADED_REAL=1 ./tests/smoke.sh
